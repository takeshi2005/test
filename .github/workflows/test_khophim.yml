name: Test KhoPhim Debug

on:
  workflow_dispatch:

jobs:
  diagnose-khophim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install aiohttp

      - name: Run KhoPhim Diagnostics
        env:
          KHOPHIM_BASE_URL: ${{ secrets.KHOPHIM_BASE_URL }}
          KHOPHIM_COOKIE: ${{ secrets.KHOPHIM_COOKIE }}
        run: python api/test_khophim_debug.py
